<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">ゲームGPUの初期描画パイプライン</title>
  <desc id="desc">初期段階ではCPUが頂点の変換と投影を担当し、FPGAが三角形のラスタライズと深度判定を行う。画像をTab5へ戻しLCDに表示する。比較には転送と待ち時間も含める。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#b8c9e6"/></marker></defs>
  <rect width="1000" height="420" rx="24" fill="#0b1426"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#eef5ff">
    <text x="500" y="46" font-size="25" font-weight="700">ゲーム描画：初期段階の役割分担</text>
    <g fill="#142a43" stroke="#4ddad4" stroke-width="2"><rect x="30" y="115" width="210" height="155" rx="16"/><rect x="280" y="115" width="210" height="155" rx="16"/><rect x="530" y="115" width="210" height="155" rx="16"/><rect x="780" y="115" width="190" height="155" rx="16"/></g>
    <g font-size="21" font-weight="700"><text x="135" y="153">CPU：頂点処理</text><text x="385" y="153">FPGA：描画</text><text x="635" y="153">DDR：画像</text><text x="875" y="153">Tab5：表示</text></g>
    <g font-size="17" fill="#c3d4ed"><text x="135" y="194">変換・投影</text><text x="135" y="225">near クリップ</text><text x="385" y="194">三角形の画素化</text><text x="385" y="225">Z 判定・色の書込み</text><text x="635" y="194">色・深度バッファ</text><text x="635" y="225">完了を待って読出し</text><text x="875" y="194">画像を受信</text><text x="875" y="225">LCD に転送</text></g>
    <g stroke="#b8c9e6" stroke-width="2.5" marker-end="url(#arrow)"><path d="M245 193H272"/><path d="M495 193H522"/><path d="M745 193H772"/></g>
    <path d="M40 300H960" stroke="#4ddad4" stroke-width="2"/>
    <text x="500" y="333" font-size="19">全体のフレーム時間：CPU 処理 ＋ 命令転送 ＋ FPGA 処理 ＋ 画像転送 ＋ 表示</text>
    <text x="500" y="371" font-size="17" fill="#b8c9e6">同じシーン・同じ描画規則で比較 ／ 初期段階はラスタライズの部分オフロード</text>
  </g>
</svg>
